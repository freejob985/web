name: Deploy Admin & API (full overwrite)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # جذر المشروع في الريبو
  LOCAL_PATH: .

  # مسارات المشروعين على السيرفر
  ADMIN_REMOTE_PATH: /home/u929533639/domains/eliteonegrocery.com/public_html/adminxd
  API_REMOTE_PATH:   /home/u929533639/domains/eliteonegrocery.com/public_html/ad

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug – list repo root
        run: |
          echo "Repo root:"
          pwd
          ls -la

      - name: Validate required secrets
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          PORT: ${{ secrets.SFTP_PORT }}
        run: |
          for var in HOST USER PASS PORT; do
            if [ -z "${!var}" ]; then
              echo "::error file=.github/workflows/deploy.yml,line=30::Secret $var is empty or missing."
              exit 1
            fi
          done
          echo "✅ All required secrets (HOST, USER, PASS, PORT) are set."

      # ⬆️ نشر المشروع كاملًا إلى adminxd (تحديث مباشر للملفات)
      - name: Deploy project to Admin (adminxd)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          local_path:  '${{ env.LOCAL_PATH }}'
          remote_path: '${{ env.ADMIN_REMOTE_PATH }}'
          sftp_only: true
          exclude: |
            .git*
            .github*
            node_modules
            storage/logs

      # ⬆️ نشر نفس المشروع كاملًا إلى ad
      - name: Deploy project to API (ad)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          local_path:  '${{ env.LOCAL_PATH }}'
          remote_path: '${{ env.API_REMOTE_PATH }}'
          sftp_only: true
          exclude: |
            .git*
            .github*
            node_modules
            storage/logs

      # 🛠 تشغيل migrate + seed + clear cache على الاثنين
      - name: Run Migrations & Seeders & Clear Cache (Admin & API)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          script: |
            set -e

            ADMIN_REMOTE_PATH="${{ env.ADMIN_REMOTE_PATH }}"
            API_REMOTE_PATH="${{ env.API_REMOTE_PATH }}"

            for APP_PATH in "$ADMIN_REMOTE_PATH" "$API_REMOTE_PATH"; do
              echo "========================================"
              echo "🔧 Processing app at: $APP_PATH"

              if [ ! -f "$APP_PATH/artisan" ]; then
                echo "⚠️ Skipping $APP_PATH (artisan not found)"
                continue
              fi

              cd "$APP_PATH"

              echo "📁 Current path:"
              pwd

              echo "🧪 Artisan version:"
              php artisan --version || true

              echo "📦 Running migrations..."
              php artisan migrate --force --no-interaction || echo "⚠️ migrate failed for $APP_PATH"

              echo "🌱 Running seeders..."
              php artisan db:seed --force --no-interaction || echo "⚠️ seeders failed for $APP_PATH"

              echo "🧹 Clearing cache..."
              php artisan cache:clear
              php artisan config:clear
              php artisan route:clear
              php artisan view:clear

              echo "✅ Done for $APP_PATH"
            done

      - name: Deployment Summary
        if: always()
        run: |
          echo "📌 Job status: ${{ job.status }}"
          echo "📁 Admin path: ${ADMIN_REMOTE_PATH}/"
          echo "📁 API   path: ${API_REMOTE_PATH}/"
          echo "🗄️ Full project deployed to both paths"
          echo "🧹 Migrations & cache cleared for both (if artisan exists)"
