name: Deploy Admin & API (changed files only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # مسارات المشاريع على السيرفر
  ADMIN_REMOTE_PATH: /home/u929533639/domains/eliteonegrocery.com/public_html/adminxd
  API_REMOTE_PATH:   /home/u929533639/domains/eliteonegrocery.com/public_html/ad
  DEPLOY_DIR: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # عشان نقدر نجيب الكوميت اللي قبل الحالي

      - name: Debug – list repo root
        run: |
          echo "Repo root:"
          pwd
          ls -la

      # ✅ تأكيد وجود بيانات الاتصال
      - name: Validate required secrets
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          PORT: ${{ secrets.SFTP_PORT }}
        run: |
          for var in HOST USER PASS PORT; do
            if [ -z "${!var}" ]; then
              echo "::error file=.github/workflows/deploy.yml,line=32::Secret $var is empty or missing."
              exit 1
            fi
          done
          echo "✅ All required secrets (HOST, USER, PASS, PORT) are set."

      # 🧠 تجهيز فولدر deploy يحتوي الملفات المتغيّرة فقط
      - name: Prepare changed files folder
        id: prepare
        run: |
          set -e

          DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          echo "🔍 Detecting changed files..."
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # لو ده مش أول كوميت
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || echo "")
            else
              # أول كوميت → اعتبر كل الملفات متغيرة
              CHANGED_FILES=$(git ls-files)
            fi
          else
            # تشغيل يدوي workflow_dispatch → اعتبر كل الملفات متغيرة
            CHANGED_FILES=$(git ls-files)
          fi

          echo "Changed files list:"
          echo "$CHANGED_FILES"

          COUNT=0

          # نسخ الملفات المتغيرة فقط إلى deploy/ مع الحفاظ على نفس التركيب
          echo "$CHANGED_FILES" | while read file; do
            [ -z "$file" ] && continue

            # استبعاد أشياء لا نحتاج رفعها
            case "$file" in
              .git/*|.github/*|node_modules/*|vendor/*|storage/logs/*)
                continue
                ;;
            esac

            if [ -f "$file" ]; then
              mkdir -p "$DEPLOY_DIR/$(dirname "$file")"
              cp "$file" "$DEPLOY_DIR/$file"
              echo "➕ copied: $file"
              COUNT=$((COUNT+1))
            fi
          done

          # نكتب عدد الملفات في ملف مؤقت لأن while subshell
          echo "$COUNT" > /tmp/changed_count.txt

          CHANGED_COUNT=$(cat /tmp/changed_count.txt)
          if [ "$CHANGED_COUNT" -eq 0 ]; then
            echo "ℹ️ No changed files to deploy."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            echo "✅ Total changed files to deploy: $CHANGED_COUNT"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      # ⬆️ نشر الملفات المتغيّرة فقط إلى adminxd
      - name: Deploy changed files to Admin (adminxd)
        if: env.HAS_CHANGES == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          # هنا نرفع من فولدر deploy فقط
          local_path:  './${{ env.DEPLOY_DIR }}'
          remote_path: '${{ env.ADMIN_REMOTE_PATH }}'
          sftp_only: true

      # ⬆️ نشر نفس الملفات المتغيّرة إلى ad
      - name: Deploy changed files to API (ad)
        if: env.HAS_CHANGES == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          local_path:  './${{ env.DEPLOY_DIR }}'
          remote_path: '${{ env.API_REMOTE_PATH }}'
          sftp_only: true

      # 🛠 تشغيل migrate + seed + clear cache على المسارين (adminxd + ad)
      - name: Run Migrations & Seeders & Clear Cache (Admin & API)
        if: env.HAS_CHANGES == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          script: |
            set -e

            ADMIN_REMOTE_PATH="${{ env.ADMIN_REMOTE_PATH }}"
            API_REMOTE_PATH="${{ env.API_REMOTE_PATH }}"

            for APP_PATH in "$ADMIN_REMOTE_PATH" "$API_REMOTE_PATH"; do
              echo "========================================"
              echo "🔧 Processing app at: $APP_PATH"

              if [ ! -f "$APP_PATH/artisan" ]; then
                echo "⚠️ Skipping $APP_PATH (artisan not found)"
                continue
              fi

              cd "$APP_PATH"

              echo "📁 Current path:"
              pwd

              echo "🧪 Artisan version:"
              php artisan --version || true

              echo "📦 Running migrations..."
              php artisan migrate --force --no-interaction || echo "⚠️ migrate failed for $APP_PATH"

              echo "🌱 Running seeders..."
              php artisan db:seed --force --no-interaction || echo "⚠️ seeders failed for $APP_PATH"

              echo "🧹 Clearing cache..."
              php artisan cache:clear
              php artisan config:clear
              php artisan route:clear
              php artisan view:clear

              echo "✅ Done for $APP_PATH"
            done

      - name: Deployment Summary
        if: always()
        run: |
          echo "📌 Job status: ${{ job.status }}"
          echo "HAS_CHANGES=$HAS_CHANGES"
          echo "📁 Admin path: ${ADMIN_REMOTE_PATH}/"
          echo "📁 API   path: ${API_REMOTE_PATH}/"
          echo "🗄️ Migrations & seeders executed only if there were changed files"
          echo "🧹 Cache cleared only if there were changed files"
