name: Deploy Admin & API (changed files only, same paths)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ADMIN_REMOTE_PATH: /home/u929533639/domains/eliteonegrocery.com/public_html/adminxd
  API_REMOTE_PATH:   /home/u929533639/domains/eliteonegrocery.com/public_html/ad

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # عشان نقدر نقارن مع الكوميت اللي قبله

      - name: Validate required secrets
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          PORT: ${{ secrets.SFTP_PORT }}
        run: |
          for var in HOST USER PASS PORT; do
            if [ -z "${!var}" ]; then
              echo "::error file=.github/workflows/deploy.yml,line=25::Secret $var is empty or missing."
              exit 1
            fi
          done
          echo "✅ All required secrets (HOST, USER, PASS, PORT) are set."

      # 🧠 استخراج قائمة الملفات المتغيرة وتحويلها لقائمة مناسبة للـ scp
      - name: Detect changed files and build source list
        run: |
          set -e

          echo "🔍 Detecting changed files..."

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_FILES_RAW=$(git diff --name-only HEAD^ HEAD || echo "")
          else
            # أول كوميت على الفرع → اعتبر كل الملفات متغيّرة
            CHANGED_FILES_RAW=$(git ls-files)
          fi

          echo "Changed files (raw):"
          echo "$CHANGED_FILES_RAW"

          CHANGED_LIST=""
          COUNT=0

          for file in $CHANGED_FILES_RAW; do
            [ -z "$file" ] && continue

            # استبعاد أشياء مش عايزين نرفعها
            case "$file" in
              .git/*|.github/*|node_modules/*|vendor/*|storage/logs/*)
                continue
                ;;
            esac

            if [ -f "$file" ]; then
              if [ -z "$CHANGED_LIST" ]; then
                CHANGED_LIST="$file"
              else
                CHANGED_LIST="$CHANGED_LIST,$file"
              fi
              COUNT=$((COUNT+1))
            fi
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "ℹ️ No changed files to deploy."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            echo "✅ Total changed files: $COUNT"
            echo "CHANGED_FILES=$CHANGED_LIST" >> $GITHUB_ENV
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            echo "Final CHANGED_FILES list (for scp):"
            echo "$CHANGED_LIST"
          fi

      # ⬆️ نسخ نفس الملفات المتغيرة إلى مسار adminxd (بنفس المسارات)
      - name: Copy changed files to Admin (adminxd)
        if: env.HAS_CHANGES == 'true'
        uses: appleboy/scp-action@v1
        with:
          host:     ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          source:   '${{ env.CHANGED_FILES }}'
          target:   '${{ env.ADMIN_REMOTE_PATH }}'
          overwrite: true

      # ⬆️ نسخ نفس الملفات المتغيرة إلى مسار ad (بنفس المسارات)
      - name: Copy changed files to API (ad)
        if: env.HAS_CHANGES == 'true'
        uses: appleboy/scp-action@v1
        with:
          host:     ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          source:   '${{ env.CHANGED_FILES }}'
          target:   '${{ env.API_REMOTE_PATH }}'
          overwrite: true

      # 🛠 تشغيل migrate + seed + clear cache فقط لو فيه تغييرات
      - name: Run Migrations & Seeders & Clear Cache (Admin & API)
        if: env.HAS_CHANGES == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          script: |
            set -e

            ADMIN_REMOTE_PATH="${{ env.ADMIN_REMOTE_PATH }}"
            API_REMOTE_PATH="${{ env.API_REMOTE_PATH }}"

            for APP_PATH in "$ADMIN_REMOTE_PATH" "$API_REMOTE_PATH"; do
              echo "========================================"
              echo "🔧 Processing app at: $APP_PATH"

              if [ ! -f "$APP_PATH/artisan" ]; then
                echo "⚠️ Skipping $APP_PATH (artisan not found)"
                continue
              fi

              cd "$APP_PATH"

              echo "📁 Current path:"
              pwd

              echo "🧪 Artisan version:"
              php artisan --version || true

              echo "📦 Running migrations..."
              php artisan migrate --force --no-interaction || echo "⚠️ migrate failed for $APP_PATH"

              echo "🌱 Running seeders..."
              php artisan db:seed --force --no-interaction || echo "⚠️ seeders failed for $APP_PATH"

              echo "🧹 Clearing cache..."
              php artisan cache:clear
              php artisan config:clear
              php artisan route:clear
              php artisan view:clear

              echo "✅ Done for $APP_PATH"
            done

      - name: Deployment Summary
        if: always()
        run: |
          echo "📌 Job status: ${{ job.status }}"
          echo "HAS_CHANGES=$HAS_CHANGES"
          echo "CHANGED_FILES=$CHANGED_FILES"
          echo "📁 Admin path: ${ADMIN_REMOTE_PATH}/"
          echo "📁 API   path: ${API_REMOTE_PATH}/"
          echo "🗄️ Only changed files were copied to both paths"
          echo "🧹 Migrations & cache cleared only when there were changes"
