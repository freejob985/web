name: Deploy Admin & API (Laravel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # ✔ الكود موجود في جذر الريبو (app, artisan, routes, ...)
  LOCAL_PATH: .

  # ✔ مسارات المشاريع على السيرفر (الفولدرين الموجودين في الاستضافة)
  ADMIN_REMOTE_PATH: /home/u929533639/domains/eliteonegrocery.com/public_html/adminxd
  API_REMOTE_PATH:   /home/u929533639/domains/eliteonegrocery.com/public_html/ad

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug – list repo root
        run: |
          echo "Repo root:"
          pwd
          echo "Top-level contents:"
          ls -la

      # ✅ تأكيد وجود الـ secrets (SFTP_HOST / SFTP_USERNAME / SFTP_PASSWORD / SFTP_PORT)
      - name: Validate required secrets
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          PORT: ${{ secrets.SFTP_PORT }}
        run: |
          for var in HOST USER PASS PORT; do
            if [ -z "${!var}" ]; then
              echo "::error file=.github/workflows/main.yml,line=32::Secret $var is empty or missing."
              exit 1
            fi
          done
          echo "✅ All required secrets (HOST, USER, PASS, PORT) are set."

      # 📤 نشر المشروع إلى مسار الأدمن على السيرفر
      - name: Deploy Admin Files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          # 👇 من جذر الريبو (لا يوجد adminxd محليًا)
          local_path:  '${{ env.LOCAL_PATH }}'
          # 👇 إلى فولدر الأدمن على السيرفر
          remote_path: '${{ env.ADMIN_REMOTE_PATH }}'
          sftp_only: true
          exclude: |
            .git*
            .github*
            node_modules
            vendor
            storage/logs

      # 📤 نشر نفس الكود إلى مسار الـ API على السيرفر
      - name: Deploy API Files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          local_path:  '${{ env.LOCAL_PATH }}'
          remote_path: '${{ env.API_REMOTE_PATH }}'
          sftp_only: true
          exclude: |
            .git*
            .github*
            node_modules
            vendor
            storage/logs

      # 🛠 تشغيل migrations + seed + clear cache على المسارين (adminxd + ad)
      - name: Run Migrations & Seeders & Clear Cache (Admin & API)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          script: |
            set -e

            ADMIN_REMOTE_PATH="${{ env.ADMIN_REMOTE_PATH }}"
            API_REMOTE_PATH="${{ env.API_REMOTE_PATH }}"

            for APP_PATH in "$ADMIN_REMOTE_PATH" "$API_REMOTE_PATH"; do
              echo "========================================"
              echo "🔍 Processing app at: $APP_PATH"

              if [ ! -f "$APP_PATH/artisan" ]; then
                echo "⚠️ Skipping $APP_PATH (artisan not found)"
                continue
              fi

              cd "$APP_PATH"

              echo "📁 Current path:"
              pwd

              echo "🧪 Artisan version:"
              php artisan --version || true

              echo "📦 Running migrations..."
              php artisan migrate --force --no-interaction || echo "⚠️ migrate failed for $APP_PATH"

              echo "🌱 Running seeders..."
              php artisan db:seed --force --no-interaction || echo "⚠️ seeders failed for $APP_PATH"

              echo "🧹 Clearing cache..."
              php artisan cache:clear
              php artisan config:clear
              php artisan route:clear
              php artisan view:clear

              echo "✅ Done for $APP_PATH"
            done

      - name: Deployment Summary
        if: always()
        run: |
          echo "📌 Job status: ${{ job.status }}"
          echo "📁 Admin deployed to: ${ADMIN_REMOTE_PATH}/"
          echo "📁 API   deployed to: ${API_REMOTE_PATH}/"
          echo "🗄️ Migrations & seeders executed (where artisan exists)"
          echo "🧹 Cache cleared (where artisan exists)"
