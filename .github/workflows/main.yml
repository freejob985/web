name: Deploy Admin (Laravel) to adminxd

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # مسار مشروع لارفيل على السيرفر
  ADMIN_REMOTE_PATH: /home/u929533639/domains/eliteonegrocery.com/public_html/adminxd

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Debug – list repo content
        run: |
          echo "Current path:"
          pwd
          echo "Repo content:"
          ls -la

      - name: 📂 Deploy Admin Files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          # 👈 أهم تعديل: نرفع كل محتوى الريبو، لأنه لا يوجد فولدر admin
          local_path: '.'
          remote_path: '${{ env.ADMIN_REMOTE_PATH }}'
          sftp_only: true

      - name: 🛠 Run Database Migrations & Seeders
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            echo "🚀 Starting database operations..."
            cd "${ADMIN_REMOTE_PATH}"

            echo "🧪 PHP version:"
            php -v || true

            echo "🧪 Artisan version:"
            php artisan --version || true

            echo "📦 Running migrations..."
            php artisan migrate --force --no-interaction

            echo "🌱 Running seeders..."
            php artisan db:seed --force --no-interaction

            echo "🎉 Migrations and seeders finished."

            echo "::group::Last 80 lines from laravel.log"
            tail -n 80 storage/logs/laravel.log || echo "No laravel.log found"
            echo "::endgroup::"

      - name: 🧹 Clear Laravel Cache
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port:     ${{ secrets.SFTP_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "🧹 Clearing cache..."
            cd "${ADMIN_REMOTE_PATH}"
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            echo "✅ Cache cleared successfully"

      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "📌 Job status: ${{ job.status }}"
          echo "📁 Admin deployed to → ${{ env.ADMIN_REMOTE_PATH }}/"
          echo "🗄️ Migrations & seeders executed"
          echo "🧹 Cache cleared"
